name: Aggiorna Playlist Video

on:
  schedule:
    # 08:17, 14:17, 18:17 e 22:17 ora solare italiana (minuto 17 per evitare code)
    - cron: '17 7,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-playlist
  cancel-in-progress: false

jobs:
  estrai:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa FFmpeg (ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installa librerie Python
        run: pip install -r requirements.txt

      - name: Installa browser Chromium per Playwright
        run: playwright install --with-deps chromium

      - name: Esegui tutti gli script Python
        id: estrai
        continue-on-error: true
        run: |
          set +e
          mkdir -p output_m3u8 archivio_storico da_recuperare recuperati
          errori=0

          for script in estrattori/*.py; do
            [ -e "$script" ] || continue
            echo "Avvio $script..."
            timeout 1800 python -u "$script"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error file=$script::Estrattore fallito con exit code $status"
              errori=1
            fi
          done

          exit "$errori"

      - name: Salva playlist e storici aggiornati
        run: |
          mkdir -p archivio_storico da_recuperare recuperati output_m3u8
          GH_HOST="github.com"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.${GH_HOST}"
          git add -A output_m3u8/ archivio_storico/ da_recuperare/ recuperati/

          git diff --cached --quiet && exit 0
          git commit -m "Aggiornamento automatico playlist"

          git fetch origin main
          git rebase -X ours origin/main
          git push origin HEAD:main

      - name: Pubblica liste e indice sul Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          set -euo pipefail
          GIST_ID=$(printf '%s' "$GIST_ID" | tr -d '[:space:]')
          GIST_TOKEN=$(printf '%s' "$GIST_TOKEN" | tr -d '[:space:]')

          API_HOST="api.github.com"
          RAW_HOST="gist.githubusercontent.com"
          GIST_API_URL="https://${API_HOST}/gists/${GIST_ID}"
          AUTH="Authorization: Bearer $GIST_TOKEN"
          CODE=$(curl -sS -o resp.json -w '%{http_code}' -H "$AUTH" -H "Accept: application/vnd.github+json" "$GIST_API_URL")
          echo "Risposta HTTP: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Errore API GitHub: $(jq -r '.message // "nessun messaggio"' resp.json 2>/dev/null || echo 'risposta non JSON')"
            exit 1
          fi
          OWNER=$(jq -r '.owner.login // empty' resp.json)
          if [ -z "$OWNER" ]; then
            echo "Il Gist non ha un proprietario: è stato creato senza accesso?"
            exit 1
          fi

          payload='{"files":{}}'
          indice=""
          for file in output_m3u8/*.m3u8; do
            [ -e "$file" ] || continue
            if ! grep -q '^#EXTINF' "$file"; then
              echo "Salto $file (nessuna voce)"
              continue
            fi
            nome=$(basename "$file")
            payload=$(jq --arg n "$nome" --rawfile c "$file" '.files[$n] = {content: $c}' <<< "$payload")
            indice+="https://${RAW_HOST}/${OWNER}/${GIST_ID}/raw/${nome}"$'\n'
          done

          if [ -z "$indice" ]; then
            echo "::warning::Nessuna lista con voci: non pubblico e lascio il Gist com'è"
            exit 0
          fi

          payload=$(jq --arg c "$indice" '.files["indice.txt"] = {content: $c}' <<< "$payload")
          printf '%s' "$payload" | curl -sS -f -X PATCH \
            -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$GIST_API_URL" -d @- > /dev/null
          echo "Indice pubblicato:"
          printf '%s' "$indice"


      - name: Segnala errori degli estrattori
        if: steps.estrai.outcome == 'failure'
        run: |
          echo "Almeno un estrattore è fallito: le liste degli altri sono state salvate e pubblicate."
          exit 1
