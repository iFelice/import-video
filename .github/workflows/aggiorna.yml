name: Aggiorna Playlist Video

on:
  schedule:
    - cron: '0 7,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estrai:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa FFmpeg (ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installa librerie Python
        run: pip install -r requirements.txt

      - name: Installa browser Chromium per Playwright
        run: playwright install --with-deps chromium

      - name: Esegui tutti gli script Python
        run: |
          for script in estrattori/*.py; do
            echo "Avvio $script..."
            python "$script"
          done

      - name: Salva playlist e storici aggiornati
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add output_m3u8/*.m3u8 archivio_storico/*.txt
          git commit -m "Aggiornamento automatico playlist" || exit 0
          git push

      - name: Pubblica tutte le liste sul Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          for file in output_m3u8/*.m3u8; do
            nome_file=$(basename "$file")
            echo "Carico $nome_file sul Gist..."
            jq -n --arg nome "$nome_file" --rawfile c "$file" '{files: {($nome): {content: $c}}}' \
            | curl -sS -X PATCH \
                -H "Authorization: Bearer $GIST_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/gists/$GIST_ID" -d @- > /dev/null
          done

