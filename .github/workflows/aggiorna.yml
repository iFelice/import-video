name: Aggiorna Playlist Video

on:
  schedule:
    - cron: '0 7,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estrai:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa FFmpeg (ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installa librerie Python
        run: pip install -r requirements.txt

      - name: Installa browser Chromium per Playwright
        run: playwright install --with-deps chromium

      - name: Esegui tutti gli script Python
        run: |
          for script in estrattori/*.py; do
            echo "Avvio $script..."
            python "$script"
          done

      - name: Salva playlist e storici aggiornati
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add output_m3u8/*.m3u8 archivio_storico/*.txt
          git commit -m "Aggiornamento automatico playlist" || exit 0
          git push

      - name: Pubblica liste e indice sul Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $GIST_TOKEN"
          OWNER=$(curl -sS -H "$AUTH" -H "Accept: application/vnd.github+json" "https://api.github.com/gists/$GIST_ID" | jq -r '.owner.login')
          if [ -z "$OWNER" ] || [ "$OWNER" = "null" ]; then
            echo "Gist non leggibile: controlla GIST_ID e GIST_TOKEN"
            exit 1
          fi
          payload='{"files":{}}'
          indice=""
          for file in output_m3u8/*.m3u8; do
            [ -e "$file" ] || continue
            if ! grep -q '^#EXTINF' "$file"; then
              echo "Salto $file (nessuna voce)"
              continue
            fi
            nome=$(basename "$file")
            payload=$(jq --arg n "$nome" --rawfile c "$file" '.files[$n] = {content: $c}' <<< "$payload")
            indice+="https://gist.githubusercontent.com/$OWNER/$GIST_ID/raw/$nome"$'\n'
          done
          if [ -z "$indice" ]; then
            echo "Nessuna lista valida: non pubblico"
            exit 1
          fi
          payload=$(jq --arg c "$indice" '.files["indice.txt"] = {content: $c}' <<< "$payload")
          printf '%s' "$payload" | curl -sS -f -X PATCH \
            -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" -d @- > /dev/null
          echo "Indice pubblicato:"
          printf '%s' "$indice"
